{% extends 'accounts/base.html' %}

{% block title %}Add Employee{% endblock %}
{% block content %}

    <style>
        input {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        label {
            font-weight: bold;
        }
    </style>

<div class="container mt-5">

    <h2>Add Employee</h2>

    <form method="POST" class="mt-3">
        {% csrf_token %}

        <div class="mb-2">
            <label>Username</label>
            {{ form.username }}
        </div>

        <div class="mb-2">
            <label>Email</label>
            {{ form.email }}
        </div>

        <div class="mb-2">
            <label>Password</label>
            {{ form.password }}
        </div>

        <div class="mb-2">
            <label>Department</label>
            {{ form.department }}
        </div>

        <div class="mb-2">
            <label>Role</label>
            {{ form.role }}
        </div>

        <div class="mb-2">
            <label>Mobile</label>
            {{ form.mobile }}
        </div>

        <button type="submit" class="btn btn-success mt-3">
            Add Employee
        </button>
    </form>

</div>
{% endblock %}
