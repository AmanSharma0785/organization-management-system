<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* 1. Full Screen Centering */
body.bg-light-gray {
    background-color: #f3f4f6;
    margin: 0;
    height: 100vh; /* Full viewport height */
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
}

/* 2. The Login Card */
.login-card {
    background: white;
    width: 100%;
    max-width: 400px; /* Limits width on large screens */
    padding: 2.5rem;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08); /* Soft shadow */
    border: 1px solid #eaeaea;
}

/* 3. Typography */
.login-header {
    text-align: center;
    margin-bottom: 2rem;
}

.login-header h2 {
    font-weight: 700;
    color: #333;
    margin-bottom: 0.5rem;
}

.login-header p {
    color: #666;
    font-size: 0.95rem;
}

.form-label {
    font-weight: 600;
    font-size: 0.9rem;
    color: #444;
}

/* 4. Input Styling (Overriding Bootstrap) */
.form-control {
    padding: 0.75rem 1rem;
    border-radius: 8px;
    border: 1px solid #ced4da;
    background-color: #fdfdfd;
}

.form-control:focus {
    box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.15);
    border-color: #0d6efd;
}

/* 5. Button Styling */
.btn-primary {
    padding: 0.75rem;
    font-weight: 600;
    border-radius: 8px;
    letter-spacing: 0.5px;
    background-color: #0d6efd;
    border: none;
    transition: transform 0.2s;
}

.btn-primary:hover {
    background-color: #0b5ed7;
    transform: translateY(-2px); /* Slight lift effect */
}
    </style>
</head>
<body class="bg-light-gray">

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h2>Welcome Back</h2>
                <p>Please enter your details to sign in.</p>
            </div>

            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="e.g. johndoe">
                </div>

                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••">
                </div>

                <button class="btn btn-primary w-100">Login</button>
            </form>
        </div>
    </div>

</body>
</html>
