{% extends 'accounts/base.html' %}

{% block title %}Edit Employee{% endblock %}

{% block content %}
    <style>
        /* Center the form on the page */
.form-body {
    background-color: #f0f2f5;
    min-height: 80vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

/* The Card */
.form-card {
    background: white;
    padding: 2.5rem;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    width: 100%;
    max-width: 450px;
}

/* Header Styling */
.form-header h2 {
    margin: 0 0 5px 0;
    color: #333;
    font-size: 1.8rem;
}

.subtitle {
    color: #666;
    font-size: 0.9rem;
    margin-bottom: 2rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid #eee;
}

/* Form Groups */
.form-group {
    margin-bottom: 1.25rem;
}

.form-group label {
    display: block;
    margin-bottom: 0.5rem;
    font-weight: 600;
    color: #444;
    font-size: 0.9rem;
}

/* TARGETING DJANGO INPUTS
   This targets any input/select inside the form-group div */
.form-group input, 
.form-group select {
    width: 100%;
    padding: 0.75rem;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 1rem;
    transition: border-color 0.2s, box-shadow 0.2s;
    box-sizing: border-box; /* Important for padding */
}

/* Focus State */
.form-group input:focus, 
.form-group select:focus {
    border-color: #4a90e2;
    outline: none;
    box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
}

/* Buttons */
.button-group {
    margin-top: 2rem;
    display: flex;
    gap: 10px;
}

.btn-save {
    flex: 2;
    background-color: #4a90e2;
    color: white;
    border: none;
    padding: 0.8rem;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.2s;
}

.btn-save:hover {
    background-color: #357abd;
}

.btn-cancel {
    flex: 1;
    text-align: center;
    background-color: #f1f3f4;
    color: #555;
    text-decoration: none;
    padding: 0.8rem;
    border-radius: 8px;
    font-weight: 600;
    transition: background 0.2s;
}

.btn-cancel:hover {
    background-color: #e4e6e8;
}
       
    </style>

<div class="container mt-5">

    <div class="form-body">
    <div class="form-card">
        <div class="form-header">
            <h2>Edit Employee</h2>
            <p class="subtitle">{{ employee.user.username }} | {{ employee.user.email }}</p>
        </div>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>Department</label>
                {{ form.department }}
            </div>

            <div class="form-group">
                <label>Role</label>
                {{ form.role }}
            </div>

            <div class="form-group">
                <label>Mobile</label>
                {{ form.mobile }}
            </div>

            <div class="button-group">
                <button type="submit" class="btn-save">Update Employee</button>
                <a href="{% url 'employee_list' %}" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
